services:
  db_test:
    image: postgres:14
    container_name: tcatb_db_test
    environment:
      POSTGRES_USER: tcatb
      POSTGRES_PASSWORD: tcatbpass
      POSTGRES_DB: tcatb_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcatb -d tcatb_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_test:
    build: ./api
    container_name: tcatb_api_test
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      PGHOST: db_test
      PGPORT: 5432
      PGUSER: tcatb
      PGPASSWORD: tcatbpass
      PGDATABASE: tcatb_test
      JWT_SECRET_KEY: test-secret-key
    ports:
      - "8000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/docs || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
