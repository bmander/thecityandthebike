included:
  - TheCityAndTheBike
  - Packages

excluded:
  - .build
  - "**/.build"
  - DerivedData

disabled_rules:
  - identifier_name
  - type_body_length
  - function_body_length
  - trailing_comma
  - nesting

opt_in_rules:
  - closure_end_indentation
  - empty_count
  - first_where
  - modifier_order
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 140
  error: 200

file_length:
  warning: 500
  error: 1000

force_cast: warning
force_try: warning

reporter: xcode
