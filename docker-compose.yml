# WARNING: Default values are for LOCAL DEVELOPMENT ONLY.
# For production, create a .env file with unique secrets (see .env.example).
services:
  db:
    image: postgres:14
    container_name: tcatb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcatb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcatbpass}
      POSTGRES_DB: tcatb_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcatb -d tcatb_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: tcatb_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: tcatb
      PGPASSWORD: ${POSTGRES_PASSWORD:-tcatbpass}
      PGDATABASE: tcatb_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret}
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  postgres_data:
