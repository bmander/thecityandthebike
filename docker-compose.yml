services:
  db:
    image: postgres:14
    container_name: tcatb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcatb
      POSTGRES_PASSWORD: tcatbpass
      POSTGRES_DB: tcatb_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: tcatb_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: tcatb
      PGPASSWORD: tcatbpass
      PGDATABASE: tcatb_dev
      JWT_SECRET_KEY: super-secret
    ports:
      - "5000:5000"

volumes:
  postgres_data: