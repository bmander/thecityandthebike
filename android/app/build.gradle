plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

def buildVersionCode = System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1

android {
    namespace 'com.thecityandthebike'
    compileSdk 35

    sourceSets {
        main {
            kotlin.srcDirs += 'src/main/kotlin'
        }
        test {
            kotlin.srcDirs += 'src/test/kotlin'
        }
        androidTest {
            kotlin.srcDirs += 'src/androidTest/kotlin'
        }
    }

    defaultConfig {
        applicationId "com.thecityandthebike"
        minSdk 26
        targetSdk 34
        versionCode buildVersionCode
        versionName "1.0.${buildVersionCode}"

        testInstrumentationRunner "com.thecityandthebike.HiltTestRunner"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/tcatb-release.keystore")
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: ""
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
        }
    }

    flavorDimensions += "environment"

    productFlavors {
        local {
            dimension "environment"
            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8000\""
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "BASE_URL", "\"https://tcatb-api-staging-821600862601.us-central1.run.app\""
        }
        production {
            dimension "environment"
            buildConfigField "String", "BASE_URL", "\"${System.getenv("PRODUCTION_BASE_URL") ?: ""}\""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'

    // Hilt DI
    implementation 'com.google.dagger:hilt-android:2.58'
    ksp 'com.google.dagger:hilt-android-compiler:2.58'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.9.7'

    // CameraX (for QR scanner preview)
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // EXIF
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'io.mockk:mockk:1.13.9'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'
    testImplementation 'app.cash.turbine:turbine:1.0.0'

    // Android Instrumented Testing
    androidTestImplementation platform('androidx.compose:compose-bom:2025.05.01')
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.58'
    kspAndroidTest 'com.google.dagger:hilt-android-compiler:2.58'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'
    androidTestImplementation 'androidx.navigation:navigation-testing:2.9.7'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
