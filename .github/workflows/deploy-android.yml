name: Deploy Android

on:
  push:
    branches:
      - staging
      - prod
    paths:
      - 'android/**'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  deploy-staging:
    name: Deploy to Firebase (Staging)
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore/tcatb-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build staging release APK
        run: ./gradlew assembleStagingRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: staging-apk
          path: android/app/build/outputs/apk/staging/release/app-staging-release.apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: android/app/build/outputs/apk/staging/release/app-staging-release.apk
          groups: internal-testers

  deploy-production:
    name: Deploy to Play Store (Production)
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore/tcatb-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build production release AAB
        run: ./gradlew bundleProductionRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-aab
          path: android/app/build/outputs/bundle/productionRelease/app-production-release.aab

      - name: Upload native debug symbols artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-native-debug-symbols
          path: android/app/build/outputs/native-debug-symbols/productionRelease/native-debug-symbols.zip

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.thecityandthebike
          releaseFiles: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          debugSymbols: android/app/build/outputs/native-debug-symbols/productionRelease/native-debug-symbols.zip
          track: internal
