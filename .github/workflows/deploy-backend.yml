name: Deploy Backend

on:
  push:
    branches:
      - staging
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'

env:
  REGION: us-central1
  SERVICE_NAME: tcatb-api
  REPOSITORY: tcatb-api

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        run: |
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "SQL_INSTANCE=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:tcatb-staging-db" >> $GITHUB_ENV
          echo "STORAGE_BUCKET=tcatb-staging-uploads" >> $GITHUB_ENV
          echo "JWT_SECRET=jwt-secret-staging" >> $GITHUB_ENV
          echo "DB_PASSWORD_SECRET=db-password-staging" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="PGHOST=/cloudsql/${{ env.SQL_INSTANCE }}" \
            --set-env-vars="PGPORT=5432" \
            --set-env-vars="PGUSER=tcatb" \
            --set-env-vars="PGDATABASE=tcatb" \
            --set-env-vars="STORAGE_BUCKET=${{ env.STORAGE_BUCKET }}" \
            --set-secrets="JWT_SECRET_KEY=${{ env.JWT_SECRET }}:latest" \
            --set-secrets="PGPASSWORD=${{ env.DB_PASSWORD_SECRET }}:latest" \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          curl -f "$SERVICE_URL/health" || exit 1
