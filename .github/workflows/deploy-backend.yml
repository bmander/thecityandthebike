name: Deploy Backend

on:
  push:
    branches:
      - staging
      - prod
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGION: us-central1
  SERVICE_NAME: tcatb-api
  REPOSITORY: tcatb-api

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "SQL_INSTANCE=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:tcatb-prod-db" >> $GITHUB_ENV
            echo "STORAGE_BUCKET=tcatb-production-uploads" >> $GITHUB_ENV
            echo "JWT_SECRET=jwt-secret-production" >> $GITHUB_ENV
            echo "DB_PASSWORD_SECRET=db-password-production" >> $GITHUB_ENV
            echo "CORS_ORIGINS=https://www.thecityandthebike.com" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "SQL_INSTANCE=${{ secrets.GCP_PROJECT_ID }}:${{ env.REGION }}:tcatb-staging-db" >> $GITHUB_ENV
            echo "STORAGE_BUCKET=tcatb-staging-uploads" >> $GITHUB_ENV
            echo "JWT_SECRET=jwt-secret-staging" >> $GITHUB_ENV
            echo "DB_PASSWORD_SECRET=db-password-staging" >> $GITHUB_ENV
            echo "CORS_ORIGINS=https://www.thecityandthebike.com" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        run: echo "IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        run: |
          JOB_NAME="migrate-db-${{ env.ENVIRONMENT }}"
          gcloud run jobs update "$JOB_NAME" \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --command="alembic" \
            --args="upgrade,head" \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --set-env-vars="PGHOST=/cloudsql/${{ env.SQL_INSTANCE }}" \
            --set-env-vars="PGPORT=5432" \
            --set-env-vars="PGUSER=tcatb" \
            --set-env-vars="PGDATABASE=tcatb" \
            --set-secrets="PGPASSWORD=${{ env.DB_PASSWORD_SECRET }}:latest" \
            --set-secrets="JWT_SECRET_KEY=${{ env.JWT_SECRET }}:latest" \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            2>/dev/null || \
          gcloud run jobs create "$JOB_NAME" \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --command="alembic" \
            --args="upgrade,head" \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --set-env-vars="PGHOST=/cloudsql/${{ env.SQL_INSTANCE }}" \
            --set-env-vars="PGPORT=5432" \
            --set-env-vars="PGUSER=tcatb" \
            --set-env-vars="PGDATABASE=tcatb" \
            --set-secrets="PGPASSWORD=${{ env.DB_PASSWORD_SECRET }}:latest" \
            --set-secrets="JWT_SECRET_KEY=${{ env.JWT_SECRET }}:latest" \
            --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud run jobs execute "$JOB_NAME" \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="PGHOST=/cloudsql/${{ env.SQL_INSTANCE }}" \
            --set-env-vars="PGPORT=5432" \
            --set-env-vars="PGUSER=tcatb" \
            --set-env-vars="PGDATABASE=tcatb" \
            --set-env-vars="STORAGE_BUCKET=${{ env.STORAGE_BUCKET }}" \
            --set-env-vars="CORS_ORIGINS=${{ env.CORS_ORIGINS }}" \
            --set-secrets="JWT_SECRET_KEY=${{ env.JWT_SECRET }}:latest" \
            --set-secrets="PGPASSWORD=${{ env.DB_PASSWORD_SECRET }}:latest" \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          curl -f "$SERVICE_URL/health" || exit 1
