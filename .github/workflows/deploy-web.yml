name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_run:
    workflows: ["Deploy Backend", "Integration Tests"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Inject API URL
        run: sed -i 's|__API_BASE_URL__|${{ vars.API_BASE_URL }}|g' web/config.js

      - name: Find latest coverage run
        id: find-coverage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/integration-tests.yml/runs?branch=main&status=completed&per_page=1" -q '.workflow_runs[0].id')
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage report
        if: steps.find-coverage.outputs.run-id
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: coverage-report
          path: web/coverage
          run-id: ${{ steps.find-coverage.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
